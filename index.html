<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahnuma – Learn. Lead.</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--k:#000;--w:#fff;--g:#6b6b6b;--l:#d9d9d9;--f:#f4f4f4}
*{box-sizing:border-box}
body{margin:0;background:var(--w);color:var(--k);font:400 16px/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Instrument Serif",Georgia,serif;font-weight:400;margin:0;line-height:1.05}
a{color:inherit}button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--k);outline-offset:2px}
.nav{background:var(--k);color:var(--w);display:flex;align-items:center;gap:20px;padding:0 24px;height:60px;position:sticky;top:0;z-index:5}
.nav .logo{font:400 26px "Instrument Serif",serif;text-decoration:none;margin-right:auto}
.nav nav{display:flex;gap:18px;align-items:center}
.nav a,.nav button.lnk{color:var(--w);text-decoration:none;background:none;border:0;cursor:pointer;font-size:15px}
.nav a:hover,.nav button.lnk:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.btn{display:inline-block;border:1.5px solid var(--k);background:var(--k);color:var(--w);padding:10px 20px;cursor:pointer;text-decoration:none;font-weight:500}
.btn.o{background:var(--w);color:var(--k)}.btn.inv{background:var(--w);color:var(--k);border-color:var(--w);padding:7px 16px}
.btn.s{padding:6px 12px;font-size:14px}.btn:disabled{opacity:.4;cursor:wait}
.hero{padding:72px 0 56px;border-bottom:1.5px solid var(--k)}
.hero h1{font-size:clamp(44px,8vw,96px);max-width:12ch}
.hero p{max-width:56ch;font-size:19px;color:var(--g);margin:18px 0 28px}
.three{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1.5px solid var(--k)}
.three div{padding:28px 24px 28px 0;border-right:1px solid var(--l)}.three div:last-child{border:0}
.three h3{font-size:26px;margin-bottom:6px}.three p{margin:0;color:var(--g)}
section{padding:44px 0}
h2{font-size:clamp(30px,4.5vw,46px);margin-bottom:6px}
.sub{color:var(--g);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;border:1.5px solid var(--k)}
.card{padding:22px;border-right:1.5px solid var(--k);border-bottom:1.5px solid var(--k);margin:0 -1.5px -1.5px 0;display:flex;flex-direction:column;gap:10px;min-height:210px}
.card h3{font-size:27px}.card p{margin:0;color:var(--g);flex:1;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{border:1px solid var(--k);padding:1px 9px;font-size:12.5px;font-weight:500}
.tag.k{background:var(--k);color:var(--w)}.tag.d{border-style:dashed;color:var(--g);border-color:var(--g)}
.auth{max-width:420px;margin:56px auto;padding:0 24px}
.auth h1{font-size:46px;margin-bottom:18px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--k);background:var(--w);border-radius:0}
.err{color:#000;font-weight:600;min-height:20px;margin:10px 0 0;font-size:14px}
.ok{background:var(--f);border:1.5px solid var(--k);padding:12px;margin-top:12px}
.hint{color:var(--g);font-size:13.5px}
.dash{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 60px)}
.side{border-right:1.5px solid var(--k);padding:24px 0;background:var(--f)}
.side a{display:block;padding:9px 24px;text-decoration:none}.side a.on{background:var(--k);color:var(--w)}
.body{padding:32px 28px 60px;min-width:0}
.tabs{display:flex;border-bottom:1.5px solid var(--k);margin:18px 0 0;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:10px 18px;cursor:pointer;font-weight:500;white-space:nowrap;margin-bottom:-1.5px}
.tabs button[aria-selected=true]{border-bottom-color:var(--k)}
.bar{height:8px;border:1.5px solid var(--k);margin:10px 0 4px;max-width:320px}.bar i{display:block;height:100%;background:var(--k)}
.item{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--l)}
.item .t{flex:1;min-width:0}.item b{display:block;font-weight:600}
.chk{width:20px;height:20px;border:1.5px solid var(--k);background:var(--w);cursor:pointer;flex:none;font-size:14px;line-height:1}
.chk.on{background:var(--k);color:var(--w)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--l);vertical-align:top}
th{border-bottom:1.5px solid var(--k);font-size:13px}
.scroll{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1.5px solid var(--k);margin:18px 0}
.stats div{padding:14px 16px;border-right:1px solid var(--l)}.stats b{display:block;font:400 34px "Instrument Serif",serif}
.empty{border:1.5px dashed var(--g);padding:26px;color:var(--g);text-align:center}
dialog{border:1.5px solid var(--k);padding:0;width:min(540px,94vw);max-height:92vh;border-radius:0}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlg{padding:24px}.dlg h2{font-size:34px}
.acct{border:1.5px solid var(--k);padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.acct small{display:block;color:var(--g)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--k);color:var(--w);padding:10px 18px;z-index:30;font-weight:500}
.load{padding:60px;text-align:center;color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:760px){.three{grid-template-columns:1fr}.three div{border:0;border-bottom:1px solid var(--l)}.dash{grid-template-columns:1fr}.side{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1.5px solid var(--k)}.side a{white-space:nowrap}.two{grid-template-columns:1fr}.nav{padding:0 14px}}
</style>
</head>
<body>
<div id="nav"></div><div id="main"><div class="load">Loading…</div></div>
<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>
<div id="toast" class="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),main=$("#main"),dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pkr=n=>n?"Rs. "+Number(n).toLocaleString("en-PK"):"Free";
const when=t=>t?new Date(t).toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short"}):"Time to be announced";
const safe=n=>n.replace(/[^\w.-]/g,"_");
const q=async p=>{const{data,error}=await p;if(error)console.error(error);return data||[]};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};
let sb,me=null,prof=null,T={c:"module",a:"payments"};
const KIND={module:["Modules","Recorded modules"],class:["Live classes","Live classes"],note:["Notes","Notes (PDF)"],link:["Links","Useful links"]};

async function boot(){
  try{const c=await(await fetch("/api/config")).json();
    if(!c.url||!c.anon)throw 0;sb=supabase.createClient(c.url,c.anon)}
  catch(e){main.innerHTML='<div class="load">Setup missing: add SUPABASE_URL and SUPABASE_ANON_KEY in Vercel, then redeploy.</div>';return}
  sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
    me=s?.user||null;prof=null;
    if(me)prof=(await q(sb.from("profiles").select("*").eq("id",me.id)))[0]||null;
    if(ev==="PASSWORD_RECOVERY")location.hash="#/reset";
    go()},0));
}
addEventListener("hashchange",()=>sb&&go());

function nav(){return `<div class="nav"><a class="logo" href="${me?"#/app":"#/signin"}">Rahnuma</a><nav>`+
 (me?`<a href="#/app">My learning</a><a href="#/live">Live classes</a>${prof?.is_admin?'<a href="#/admin">Admin</a>':""}<button class="lnk" data-act="out">Sign out</button>`:"")+`</nav></div>`}

async function go(){
  const h=location.hash.slice(1)||"/";
  if(/access_token|type=recovery|error_description|code=/.test(h))return;
  $("#nav").innerHTML=nav();
  const [,r="",id]=h.split("/");
  if(!r){location.hash=me?"#/app":"#/signin";return}
  if(["app","live","course","admin","reset"].includes(r)&&!me){location.hash="#/signin";return}
  if(r==="admin"&&!prof?.is_admin){location.hash="#/app";return}
  if(["signin","signup","forgot"].includes(r)&&me){location.hash="#/app";return}
  const V={"":landing,signin:()=>authV("signin"),signup:()=>authV("signup"),forgot:()=>authV("forgot"),reset:()=>authV("reset"),app:dash,live,course:()=>course(id),admin:admin};
  main.innerHTML='<div class="load">Loading…</div>';
  main.innerHTML=await(V[r]||landing)();scrollTo(0,0);
}

async function landing(){
  const cs=await q(sb.from("courses").select("*").order("position"));
  return `<div class="wrap"><div class="hero"><h1>Skills for the next step.</h1>
  <p>A three-stage programme for Pakistani students: career readiness, live masterclasses in digital and AI leadership, and a capstone community project. Free to start.</p>
  <a class="btn" href="#/signup">Create free account</a> <a class="btn o" href="#/signin">Sign in</a></div>
  <div class="three"><div><h3>Foundations</h3><p>CV, LinkedIn, cover letters and interview preparation.</p></div>
  <div><h3>Masterclasses</h3><p>Live sessions with instructors, recorded replays and Q&amp;A.</p></div>
  <div><h3>Capstone</h3><p>Build a community project and earn a certificate.</p></div></div>
  <section><h2>Courses</h2><p class="sub">Free modules open on sign up. Paid content unlocks after payment approval.</p>
  <div class="grid">${cs.map(c=>`<div class="card"><div class="row"><span class="tag ${c.price?"":"k"}">${c.is_bundle?"Bundle":c.price?"Paid":"Free"}</span><b>${pkr(c.price)}</b></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><a class="btn s" href="#/${me?"course/"+c.id:"signup"}" style="align-self:flex-start">${me?"Open":"Join"}</a></div>`).join("")}</div></section></div>`}

function authV(k){
  const f={
   signin:["Sign in",`<label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><p class="hint"><a href="#/forgot">Forgot password?</a></p>`,"Sign in",`<p class="hint">New here? <a href="#/signup">Create an account</a></p>`],
   signup:["Create account",`<label>Full name</label><input name="name" required><div class="two"><div><label>City</label><input name="city"></div><div><label>University</label><input name="uni"></div></div><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">`,"Sign up",`<p class="hint">Already have an account? <a href="#/signin">Sign in</a></p>`],
   forgot:["Reset password",`<p class="hint">Enter your email and we will send you a reset link.</p><label>Email</label><input name="email" type="email" required>`,"Send reset link",`<p class="hint"><a href="#/signin">Back to sign in</a></p>`],
   reset:["New password",`<label>New password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">`,"Save password",""]}[k];
  return `<div class="auth"><h1>${f[0]}</h1><form data-form="${k}">${f[1]}<div class="err" role="alert"></div><button class="btn" style="width:100%;margin-top:12px">${f[2]}</button></form>${f[3]}</div>`}

const approvedFor=(c,pays)=>prof?.is_admin||c.price==0||pays.some(p=>p.status==="approved"&&(p.course_id===c.id||p.courses?.is_bundle));
const stat=s=>s==="approved"?'<span class="tag k">Approved</span>':s==="rejected"?'<span class="tag d">Rejected</span>':'<span class="tag">Pending verification</span>';
const myPays=()=>q(sb.from("payments").select("*,courses(title,is_bundle)").eq("user_id",me.id).order("created_at",{ascending:false}));

async function dash(){
  const [cs,pays]=await Promise.all([q(sb.from("courses").select("*").order("position")),myPays()]);
  return `<div class="dash"><aside class="side"><a class="on" href="#/app">My learning</a><a href="#/live">Live classes</a></aside><div class="body">
  <h2>Hello, ${esc(prof?.full_name||"student")}</h2><p class="sub">Pick a course to see its modules, live classes, notes and links.</p>
  <div class="grid">${cs.map(c=>{const ok=approvedFor(c,pays);return `<div class="card"><div class="row"><span class="tag ${ok?"k":"d"}">${ok?(c.price?"Unlocked":"Free"):"Locked"}</span><b>${pkr(c.price)}</b></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p>
  <div><a class="btn s" href="#/course/${c.id}">Open</a> ${ok?"":`<button class="btn s o" data-act="unlock" data-id="${c.id}">Unlock</button>`}</div></div>`}).join("")}</div>
  <h2 style="margin-top:44px">Payments</h2><p class="sub">Approved payments unlock content automatically.</p>
  ${pays.length?`<div class="scroll"><table><tr><th>Course</th><th>Method</th><th>TID</th><th>Status</th><th></th></tr>${pays.map(p=>`<tr><td>${esc(p.courses?.title)}</td><td>${p.method}</td><td>${esc(p.tid)}</td><td>${stat(p.status)}${p.status==="rejected"?`<div class="hint">${esc(p.reason)}</div>`:""}</td><td>${p.status==="rejected"?`<button class="btn s o" data-act="unlock" data-id="${p.course_id}">Submit again</button>`:""}</td></tr>`).join("")}</table></div>`:'<div class="empty">No payments yet.</div>'}
  <h2 style="margin-top:44px">Profile</h2>
  <form data-form="profile" style="max-width:420px"><label>Full name</label><input name="name" value="${esc(prof?.full_name)}"><div class="two"><div><label>City</label><input name="city" value="${esc(prof?.city)}"></div><div><label>University</label><input name="uni" value="${esc(prof?.university)}"></div></div><div class="err"></div><button class="btn s">Save profile</button></form>
  </div></div>`}

async function course(id){
  const {data:c}=await sb.from("courses").select("*").eq("id",id).single();
  if(!c)return '<div class="load">Course not found.</div>';
  const [ls,pr,pays]=await Promise.all([q(sb.from("lessons").select("*").eq("course_id",id).order("position")),q(sb.from("lesson_progress").select("lesson_id").eq("user_id",me.id)),myPays()]);
  const done=new Set(pr.map(x=>x.lesson_id)),ok=approvedFor(c,pays),mods=ls.filter(l=>l.kind==="module");
  const pct=mods.length?Math.round(mods.filter(m=>done.has(m.id)).length/mods.length*100):0;
  const list=ls.filter(l=>l.kind===T.c);
  const open=l=>l.is_free||ok;
  return `<div class="dash"><aside class="side"><a href="#/app">My learning</a><a class="on" href="#/course/${id}">${esc(c.title)}</a></aside><div class="body">
  <h2>${esc(c.title)}</h2><p class="sub" style="margin-bottom:0">${esc(c.description)}</p>
  ${mods.length?`<div class="bar"><i style="width:${pct}%"></i></div><div class="hint">${pct}% of modules complete</div>`:""}
  ${ok?"":`<div class="ok">Some content is locked. <button class="btn s" data-act="unlock" data-id="${id}">Unlock for ${pkr(c.price)}</button></div>`}
  <div class="tabs" role="tablist">${Object.keys(KIND).map(k=>`<button role="tab" aria-selected="${k===T.c}" data-act="tab" data-v="${k}">${KIND[k][0]} (${ls.filter(l=>l.kind===k).length})</button>`).join("")}</div>
  ${list.length?list.map(l=>`<div class="item">${l.kind==="module"&&open(l)?`<button class="chk ${done.has(l.id)?"on":""}" data-act="done" data-id="${l.id}" aria-label="Mark complete">${done.has(l.id)?"✓":""}</button>`:""}
  <div class="t"><b>${esc(l.title)}</b><span class="hint">${l.kind==="class"?when(l.starts_at):KIND[l.kind][1]}</span></div>
  <span class="tag ${open(l)?"k":"d"}">${l.is_free&&c.price?"Free preview":open(l)?"Open":"Locked"}</span>
  ${open(l)?`<button class="btn s" data-act="open" data-id="${l.id}">${l.kind==="class"?"Join":l.kind==="note"?"Download":l.kind==="link"?"Visit":"Watch"}</button>`:`<button class="btn s o" data-act="unlock" data-id="${id}">Unlock</button>`}</div>`).join(""):`<div class="empty" style="margin-top:18px">Nothing here yet.</div>`}
  </div></div>`}

let PLAN=null;
const AC=()=>sessionStorage.getItem("ac");
const localDT=t=>{const d=new Date(t);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
async function api(path,body,code){
  const t=(await sb.auth.getSession()).data.session?.access_token;
  const r=await fetch("/api/"+path,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+t,...(code?{"x-admin-code":code}:{})},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
const rowBtns=(t,id)=>`<button class="btn s o" data-act="edit" data-t="${t}" data-id="${id}">Edit</button> <button class="btn s o" data-act="del" data-t="${t}" data-id="${id}">Delete</button>`;
const aiCell=p=>p.payment_ai?`<span class="tag ${p.payment_ai.verdict==="pass"?"k":"d"}">AI: ${p.payment_ai.verdict==="pass"?"verified":"needs review"}</span><div class="hint">${esc(p.payment_ai.note)}</div>`:'<span class="hint">Not checked</span>';
function gate(){return `<div class="auth"><h1>Admin access</h1><p class="hint">Enter the admin code to continue.</p><form data-form="unlock"><label>Admin code</label><input name="code" type="password" required autocomplete="off"><div class="err" role="alert"></div><button class="btn" style="width:100%;margin-top:12px">Unlock</button></form></div>`}
const aiBox=cs=>`<div class="ok" style="margin:18px 0"><h3 style="font-size:28px">AI: arrange course content</h3><p class="hint">Paste raw notes, links or a lesson list. AI sorts it into modules, notes and links. You review before anything is saved.</p><form data-form="aicourse"><label>Course</label><select name="course_id">${cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select><label>Raw content</label><textarea name="text" rows="6" required></textarea><div class="err"></div><button class="btn s" style="margin-top:10px">Arrange with AI</button></form><div id="plan"></div></div>`;
function listC(cs,ls){return `<h3 style="font-size:30px;margin:38px 0 8px">Your courses</h3><div class="scroll"><table><tr><th>Course</th><th>Price</th><th></th></tr>${cs.map(c=>`<tr><td>${esc(c.title)}</td><td>${pkr(c.price)}</td><td>${rowBtns("courses",c.id)}</td></tr>`).join("")}</table></div>
<h3 style="font-size:30px;margin:38px 0 8px">Modules, notes and links</h3>${ls.length?`<div class="scroll"><table><tr><th>Title</th><th>Course</th><th>Type</th><th></th></tr>${ls.map(l=>`<tr><td>${esc(l.title)}</td><td>${esc(l.courses?.title)}</td><td>${l.kind}${l.is_free?" · free":""}</td><td>${rowBtns("lessons",l.id)}</td></tr>`).join("")}</table></div>`:'<div class="empty">Nothing added yet.</div>'}`}
async function live(){
  const [ls,cs,pays]=await Promise.all([q(sb.from("live_classes").select("*").order("starts_at")),q(sb.from("courses").select("*")),myPays()]);
  const cm=Object.fromEntries(cs.map(c=>[c.id,c])),cut=Date.now()-72e5;
  const row=l=>{const c=cm[l.course_id],ok=!c||approvedFor(c,pays);return `<div class="item"><div class="t"><b>${esc(l.title)}</b><span class="hint">${when(l.starts_at)} · ${c?esc(c.title)+" students":"Open to everyone"}</span>${l.description?`<div class="hint">${esc(l.description)}</div>`:""}</div>${ok?`<button class="btn s" data-act="join" data-id="${l.id}">Join</button>`:`<button class="btn s o" data-act="unlock" data-id="${c.id}">Unlock</button>`}</div>`};
  const up=ls.filter(l=>new Date(l.starts_at)>=cut),old=ls.filter(l=>new Date(l.starts_at)<cut).reverse();
  return `<div class="dash"><aside class="side"><a href="#/app">My learning</a><a class="on" href="#/live">Live classes</a></aside><div class="body"><h2>Live classes</h2><p class="sub">Times are shown in your device time zone.</p>
  <h3 style="font-size:28px">Upcoming</h3>${up.length?up.map(row).join(""):'<div class="empty">No upcoming classes yet.</div>'}
  ${old.length?`<h3 style="font-size:28px;margin-top:34px">Earlier</h3>${old.map(row).join("")}`:""}</div></div>`}
const EF={courses:[["title","Title"],["description","Description","ta"],["price","Price (PKR)","num"],["position","Position","num"],["is_bundle","Bundle: unlocks every course","chk"]],
live_classes:[["title","Title"],["description","Description","ta"],["starts_at","Date and time","dt"],["course_id","Who can join","sel"],["url","Zoom or Meet link","url"]],
lessons:[["title","Title"],["position","Position","num"],["is_free","Free preview","chk"],["url","Link or video URL","url"]]};
const SEC={live_classes:["live_links","class_id"],lessons:["lesson_secrets","lesson_id"]};
async function editor(tbl,id){
  const{data:r}=await sb.from(tbl).select("*").eq("id",id).single();
  let url="";const sc=SEC[tbl];
  if(sc){const{data:x}=await sb.from(sc[0]).select("url").eq(sc[1],id).maybeSingle();url=x?.url||""}
  const cs=await q(sb.from("courses").select("id,title").order("position")),row={...r,url};
  const inp=([k,l,t])=>{const v=row[k];
    if(t==="ta")return `<label>${l}</label><textarea name="${k}" rows="2">${esc(v)}</textarea>`;
    if(t==="chk")return `<label><input type="checkbox" name="${k}" style="width:auto" ${v?"checked":""}> ${l}</label>`;
    if(t==="sel")return `<label>${l}</label><select name="${k}"><option value="">Everyone</option>${cs.map(c=>`<option value="${c.id}" ${c.id===v?"selected":""}>${esc(c.title)} students</option>`).join("")}</select>`;
    if(t==="dt")return `<label>${l}</label><input name="${k}" type="datetime-local" value="${v?localDT(v):""}" required>`;
    return `<label>${l}</label><input name="${k}" type="${t==="num"?"number":k==="url"?"url":"text"}" value="${esc(v)}" ${k==="title"||(tbl==="live_classes"&&k==="url")?"required":""}>`};
  $("#dbody").innerHTML=`<h2>Edit</h2><form data-form="edit" data-t="${tbl}" data-id="${id}">${EF[tbl].map(inp).join("")}<div class="err"></div><div class="row" style="margin-top:14px"><button type="button" class="btn o" data-act="close">Cancel</button><button class="btn">Save changes</button></div></form>`;
  dlg.showModal()}

async function admin(){
  if(!AC())return gate();
  const tabs=["payments","live","content","settings"];
  let b="";
  if(T.a==="payments"){
    const ps=await q(sb.from("payments").select("*,profiles(full_name),courses(title,price),payment_ai(verdict,note)").order("created_at",{ascending:false}));
    const ap=ps.filter(p=>p.status==="approved");
    b=`<div class="stats"><div><b>${ps.filter(p=>p.status==="pending").length}</b>Pending</div><div><b>${ap.length}</b>Approved</div><div><b>${pkr(ap.reduce((a,p)=>a+(p.courses?.price||0),0))}</b>Revenue</div></div>
    ${ps.length?`<div class="scroll"><table><tr><th>Student</th><th>Course</th><th>Method</th><th>Sender</th><th>TID</th><th>Receipt</th><th>AI check</th><th>Status</th><th></th></tr>${ps.map(p=>`<tr><td>${esc(p.profiles?.full_name)}</td><td>${esc(p.courses?.title)}<div class="hint">${pkr(p.courses?.price)}</div></td><td>${p.method}</td><td>${esc(p.sender_phone)}</td><td>${esc(p.tid)}</td><td><button class="btn s o" data-act="rcpt" data-p="${esc(p.receipt_path)}">View</button></td><td>${aiCell(p)}</td><td>${stat(p.status)}</td><td>${p.status==="pending"?`<button class="btn s" data-act="appr" data-id="${p.id}">Approve</button> <button class="btn s o" data-act="rej" data-id="${p.id}">Reject</button>`:""}</td></tr>`).join("")}</table></div>`:'<div class="empty">No payment requests.</div>'}`;
  }else if(T.a==="live"){
    const [ls,cs]=await Promise.all([q(sb.from("live_classes").select("*,courses(title)").order("starts_at",{ascending:false})),q(sb.from("courses").select("id,title").order("position"))]);
    b=`<p class="sub" style="margin-top:18px">Every signed-in student sees these on the Live classes page. Zoom links stay hidden from anyone who has not unlocked the course.</p>
    <div class="ok"><h3 style="font-size:28px">AI: paste the class message</h3><p class="hint">Example: "Digital AI masterclass tomorrow 8pm, https://zoom.us/j/123". AI fills the form below. You check it, then press Add.</p><form data-form="ailive"><textarea name="text" rows="3" required></textarea><div class="err"></div><button class="btn s" style="margin-top:10px">Fill form with AI</button></form></div>
    <h3 style="font-size:30px;margin:26px 0 0">Add live class</h3><form data-form="addlive" style="max-width:520px"><label>Title</label><input name="title" required><label>Description (optional)</label><textarea name="desc" rows="2"></textarea><label>Date and time</label><input name="starts_at" type="datetime-local" required><label>Zoom or Meet link</label><input name="url" type="url" placeholder="https://zoom.us/j/..." required><label>Who can join</label><select name="course_id"><option value="">Everyone</option>${cs.map(c=>`<option value="${c.id}">${esc(c.title)} students</option>`).join("")}</select><div class="err"></div><button class="btn s" style="margin-top:12px">Add live class</button></form>
    <h3 style="font-size:30px;margin:34px 0 8px">Scheduled</h3>${ls.length?`<div class="scroll"><table><tr><th>Class</th><th>When</th><th>Who</th><th></th></tr>${ls.map(l=>`<tr><td>${esc(l.title)}</td><td>${when(l.starts_at)}</td><td>${l.courses?esc(l.courses.title):"Everyone"}</td><td>${rowBtns("live_classes",l.id)}</td></tr>`).join("")}</table></div>`:'<div class="empty">No live classes yet.</div>'}`;
  }else if(T.a==="content"){
    const cs=await q(sb.from("courses").select("*").order("position"));
    const all=await q(sb.from("lessons").select("*,courses(title)").order("created_at",{ascending:false}));
    const opts=cs.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("");
    b=`${aiBox(cs)}<h3 style="font-size:30px;margin:18px 0 0">Add course</h3><form data-form="addcourse" style="max-width:520px"><label>Title</label><input name="title" required><label>Description</label><textarea name="desc" rows="2"></textarea><div class="two"><div><label>Price (PKR, 0 = free)</label><input name="price" type="number" min="0" value="0"></div><div><label>Position</label><input name="pos" type="number" value="0"></div></div><label><input type="checkbox" name="bundle" style="width:auto"> Bundle (unlocks every course)</label><div class="err"></div><button class="btn s">Add course</button></form>
    <h3 style="font-size:30px;margin:34px 0 0">Add module, class, note or link</h3><form data-form="addlesson" style="max-width:520px"><label>Course</label><select name="course_id">${opts}</select><div class="two"><div><label>Type</label><select name="kind"><option value="module">Module (video)</option><option value="class">Live class</option><option value="note">Note (PDF)</option><option value="link">Link</option></select></div><div><label>Position</label><input name="position" type="number" value="0"></div></div><label>Title</label><input name="title" required><label>Link (video, Zoom/Meet or website)</label><input name="url" type="url"><label>PDF file (for notes)</label><input name="file" type="file" accept="application/pdf"><label>Class date and time (live classes)</label><input name="starts_at" type="datetime-local"><label><input type="checkbox" name="is_free" style="width:auto"> Free preview</label><div class="err"></div><button class="btn s">Add</button></form>`+listC(cs,all);
  }else{
    const st=Object.fromEntries((await q(sb.from("settings").select("*"))).map(r=>[r.key,r.value]));
    const F=[["jc_number","JazzCash number"],["jc_title","JazzCash account title"],["ep_number","EasyPaisa number"],["ep_title","EasyPaisa account title"],["raast_id","Raast ID / IBAN"],["ai_auto_approve","AI auto-approve payments (on or off)"]];
    b=`<form data-form="settings" style="max-width:420px">${F.map(([k,l])=>`<label>${l}</label><input name="${k}" value="${esc(st[k])}">`).join("")}<div class="err"></div><button class="btn s" style="margin-top:12px">Save payment details</button></form>`;
  }
  return `<div class="dash"><aside class="side"><a class="on" href="#/admin">Admin</a><a href="#/app">Student view</a></aside><div class="body"><h2>Admin</h2>
  <div class="tabs">${tabs.map(t=>`<button aria-selected="${t===T.a}" data-act="atab" data-v="${t}">${{payments:"Payments",live:"Live classes",content:"Courses & content",settings:"Settings"}[t]}</button>`).join("")}</div>${b}</div></div>`}

async function checkout(id){
  const [{data:c},st]=await Promise.all([sb.from("courses").select("*").eq("id",id).single(),q(sb.from("settings").select("*"))]);
  const s=Object.fromEntries(st.map(r=>[r.key,r.value]));
  const a=(n,num,t,extra)=>`<div class="acct"><div><b>${n}</b><small>${esc(t)} · ${esc(num)}</small>${extra?`<small>${esc(extra)}</small>`:""}</div><button class="btn s o" data-act="copy" data-v="${esc(num)}">Copy number</button></div>`;
  $("#dbody").innerHTML=`<h2>Unlock ${esc(c.title)}</h2><p class="sub">Send <b>${pkr(c.price)}</b> to one account, then confirm below.</p>
  ${a("JazzCash",s.jc_number,s.jc_title)}${a("EasyPaisa",s.ep_number,s.ep_title,"Raast ID: "+(s.raast_id||""))}
  <form data-form="pay" data-id="${id}"><div class="two"><div><label>Your mobile number</label><input name="phone" inputmode="numeric" maxlength="11" placeholder="03XXXXXXXXX" required></div><div><label>Method</label><select name="method"><option>JazzCash</option><option>EasyPaisa</option></select></div></div>
  <label>Transaction ID (11 or 12 digits)</label><input name="tid" inputmode="numeric" maxlength="12" required><label>Receipt screenshot</label><input name="file" type="file" accept="image/*" required>
  <div class="err" role="alert"></div><div class="row" style="margin-top:14px"><button type="button" class="btn o" data-act="close">Cancel</button><button class="btn">Submit for verification</button></div></form>`;
  dlg.showModal()}

const err=(f,m)=>{f.querySelector(".err").textContent=m;f.querySelector("button:not([type=button])").disabled=false};
const H={
 async signin(f,d){const{error}=await sb.auth.signInWithPassword({email:d.get("email"),password:d.get("password")});if(error)return err(f,error.message);location.hash="#/app"},
 async signup(f,d){const{data,error}=await sb.auth.signUp({email:d.get("email"),password:d.get("password"),options:{emailRedirectTo:location.origin,data:{full_name:d.get("name"),city:d.get("city"),university:d.get("uni")}}});
  if(error)return err(f,error.message);
  if(data.session){location.hash="#/app";return}
  f.innerHTML='<div class="ok">Check your email and tap the confirmation link, then sign in.</div>'},
 async forgot(f,d){const{error}=await sb.auth.resetPasswordForEmail(d.get("email"),{redirectTo:location.origin});if(error)return err(f,error.message);f.innerHTML='<div class="ok">If that email has an account, a reset link is on its way.</div>'},
 async reset(f,d){const{error}=await sb.auth.updateUser({password:d.get("password")});if(error)return err(f,error.message);toast("Password updated");location.hash="#/app"},
 async profile(f,d){const{error}=await sb.from("profiles").update({full_name:d.get("name"),city:d.get("city"),university:d.get("uni")}).eq("id",me.id);if(error)return err(f,error.message);prof={...prof,full_name:d.get("name"),city:d.get("city"),university:d.get("uni")};toast("Profile saved");f.querySelector("button").disabled=false},
 async pay(f,d){const ph=d.get("phone").trim(),tid=d.get("tid").trim(),file=d.get("file");
  if(!/^03\d{9}$/.test(ph))return err(f,"Enter an 11-digit mobile number starting with 03.");
  if(!/^\d{11,12}$/.test(tid))return err(f,"Transaction ID must be 11 or 12 digits.");
  if(!file||!file.size)return err(f,"Attach your receipt screenshot.");
  if(file.size>5e6)return err(f,"Screenshot must be under 5 MB.");
  const path=`${me.id}/${Date.now()}-${safe(file.name)}`;
  let{error}=await sb.storage.from("receipts").upload(path,file);if(error)return err(f,error.message);
  const ins=await sb.from("payments").insert({user_id:me.id,course_id:f.dataset.id,method:d.get("method"),sender_phone:ph,tid,receipt_path:path}).select("id").single();error=ins.error;
  if(error)return err(f,error.code==="23505"?"This transaction ID was already submitted.":error.message);
  dlg.close();toast("Checking your payment…");
  try{const r=await api("verify-payment",{payment_id:ins.data.id});toast(r.status==="approved"?"Payment verified. Content unlocked!":"Submitted. Admin will verify shortly.")}catch(x){toast("Submitted. Pending verification.")}
  go()},
 async addcourse(f,d){const{error}=await sb.from("courses").insert({title:d.get("title"),description:d.get("desc"),price:+d.get("price")||0,position:+d.get("pos")||0,is_bundle:d.get("bundle")==="on"});if(error)return err(f,error.message);toast("Course added");go()},
 async addlesson(f,d){const file=d.get("file");let fp=null;
  if(file&&file.size){fp=`${d.get("course_id")}/${Date.now()}-${safe(file.name)}`;const{error}=await sb.storage.from("notes").upload(fp,file);if(error)return err(f,error.message)}
  const{data:l,error}=await sb.from("lessons").insert({course_id:d.get("course_id"),kind:d.get("kind"),title:d.get("title"),is_free:d.get("is_free")==="on",position:+d.get("position")||0,starts_at:d.get("starts_at")?new Date(d.get("starts_at")).toISOString():null}).select().single();
  if(error)return err(f,error.message);
  const r=await sb.from("lesson_secrets").insert({lesson_id:l.id,url:d.get("url")||null,file_path:fp});
  if(r.error)return err(f,r.error.message);toast("Added");go()},
 async unlock(f,d){await api("admin-unlock",{},d.get("code"));sessionStorage.setItem("ac",d.get("code"));go()},
 async aicourse(f,d){const r=await api("ai-course",{text:d.get("text")},AC());PLAN={course_id:d.get("course_id"),items:r.items};
  $("#plan").innerHTML=`<p><b>${esc(r.summary)}</b></p>${r.items.map(i=>`<div class="item"><span class="tag">${i.kind}</span><div class="t"><b>${esc(i.title)}</b><span class="hint">${esc(i.url)}</span></div></div>`).join("")}<button class="btn s" data-act="applyplan" style="margin-top:12px">Add ${r.items.length} items to course</button>`;
  f.querySelector("button").disabled=false},
 async ailive(f,d){const r=await api("ai-live",{text:d.get("text")},AC());const g=document.querySelector("[data-form=addlive]").elements;
  g.title.value=r.title;g.desc.value=r.description;g.url.value=r.url;g.course_id.value=r.course_id||"";g.starts_at.value=r.start?localDT(r.start):"";
  toast(r.start&&r.url?"AI filled the form. Check it, then press Add.":"AI filled what it could. Complete the missing fields.");f.querySelector("button").disabled=false},
 async addlive(f,d){const{data:c,error}=await sb.from("live_classes").insert({title:d.get("title"),description:d.get("desc"),starts_at:new Date(d.get("starts_at")).toISOString(),course_id:d.get("course_id")||null}).select().single();
  if(error)return err(f,error.message);
  const r=await sb.from("live_links").insert({class_id:c.id,url:d.get("url")});
  if(r.error){await sb.from("live_classes").delete().eq("id",c.id);return err(f,r.error.message)}
  toast("Live class added");go()},
 async edit(f,d){const t=f.dataset.t,id=f.dataset.id,o={};
  for(const[k,,ty]of EF[t]){if(k==="url")continue;let v=d.get(k);
   if(ty==="chk")v=v==="on";else if(ty==="num")v=+v||0;else if(ty==="dt")v=new Date(v).toISOString();else if(ty==="sel")v=v||null;o[k]=v}
  let{error}=await sb.from(t).update(o).eq("id",id);if(error)return err(f,error.message);
  if(SEC[t]){const[tb,col]=SEC[t];({error}=await sb.from(tb).upsert({[col]:id,url:d.get("url")||null}));if(error)return err(f,error.message)}
  dlg.close();toast("Saved");go()},
 async settings(f,d){const rows=[...d.entries()].map(([key,value])=>({key,value}));const{error}=await sb.from("settings").upsert(rows);if(error)return err(f,error.message);toast("Saved");f.querySelector("button").disabled=false}
};
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  f.querySelector(".err")&&(f.querySelector(".err").textContent="");
  const b=f.querySelector("button:not([type=button])");if(b)b.disabled=true;
  try{await H[f.dataset.form](f,new FormData(f))}catch(x){if(/admin code/i.test(x.message))sessionStorage.removeItem("ac");err(f,x.message||"Something went wrong. Try again.")}});

const A={
 async out(){await sb.auth.signOut();location.hash="#/"},
 unlock:el=>checkout(el.dataset.id),
 tab:el=>{T.c=el.dataset.v;go()},atab:el=>{T.a=el.dataset.v;go()},
 close:()=>dlg.close(),
 copy:el=>navigator.clipboard.writeText(el.dataset.v).then(()=>toast("Number copied"),()=>toast("Copy failed. Select it manually.")),
 async done(el){const id=el.dataset.id,on=el.classList.contains("on");
  const r=on?await sb.from("lesson_progress").delete().eq("user_id",me.id).eq("lesson_id",id):await sb.from("lesson_progress").insert({user_id:me.id,lesson_id:id});
  if(r.error)return toast(r.error.message);go()},
 async open(el){const{data:s}=await sb.from("lesson_secrets").select("*").eq("lesson_id",el.dataset.id).maybeSingle();
  if(!s)return toast("This item is locked. Unlock the course first.");
  if(s.file_path){const{data,error}=await sb.storage.from("notes").createSignedUrl(s.file_path,300);if(error)return toast(error.message);window.open(data.signedUrl,"_blank")}
  else if(s.url)window.open(s.url,"_blank","noopener");else toast("No link added yet.")},
 edit:el=>editor(el.dataset.t,el.dataset.id),
 async del(el){if(!confirm("Delete this permanently?"))return;const{error}=await sb.from(el.dataset.t).delete().eq("id",el.dataset.id);if(error)return toast(error.message);toast("Deleted");go()},
 async join(el){const{data:s}=await sb.from("live_links").select("url").eq("class_id",el.dataset.id).maybeSingle();
  if(!s)return toast("This class is locked. Unlock the course first.");window.open(s.url,"_blank","noopener")},
 async applyplan(el){if(!PLAN)return;el.disabled=true;
  const{data:mx}=await sb.from("lessons").select("position").eq("course_id",PLAN.course_id).order("position",{ascending:false}).limit(1);
  let pos=mx?.[0]?.position||0;const items=PLAN.items.map(i=>({...i,position:++pos}));
  const{data:rows,error}=await sb.from("lessons").insert(items.map(i=>({course_id:PLAN.course_id,kind:i.kind,title:i.title,position:i.position}))).select("id,position");
  if(error){el.disabled=false;return toast(error.message)}
  const by=Object.fromEntries(rows.map(r=>[r.position,r.id])),sec=items.filter(i=>i.url).map(i=>({lesson_id:by[i.position],url:i.url}));
  if(sec.length){const r2=await sb.from("lesson_secrets").insert(sec);if(r2.error)return toast(r2.error.message)}
  PLAN=null;toast("Added to course");go()},
 async rcpt(el){const{data,error}=await sb.storage.from("receipts").createSignedUrl(el.dataset.p,300);if(error)return toast(error.message);window.open(data.signedUrl,"_blank")},
 async appr(el){const{error}=await sb.from("payments").update({status:"approved",reason:null}).eq("id",el.dataset.id);if(error)return toast(error.message);toast("Approved");go()},
 async rej(el){const r=prompt("Reason for rejection (shown to the student):","Transaction ID does not match.");if(r===null)return;
  const{error}=await sb.from("payments").update({status:"rejected",reason:r||"Receipt could not be verified."}).eq("id",el.dataset.id);if(error)return toast(error.message);go()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&A[el.dataset.act])A[el.dataset.act](el)});
boot();
</script>
