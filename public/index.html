<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>softskill – Learn. Lead.</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="/supabase.js"></script>
<style>
:root{--bg:#F4F4F5;--s:#fff;--k:#0A0A0A;--g:#71717A;--l:rgba(10,10,10,.09);--sh:0 1px 2px rgba(0,0,0,.04),0 10px 28px -10px rgba(0,0,0,.14)}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;color:var(--k);font:400 15.5px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(60% 40% at 88% -5%,#fff 0,transparent 70%),radial-gradient(50% 40% at 0% 100%,#e8e8ea 0,transparent 70%),var(--bg);min-height:100vh}
h1,h2,h3{font-weight:700;letter-spacing:-.03em;line-height:1.12;margin:0}
h2{font-size:clamp(22px,2.6vw,28px)}
a{color:inherit}button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.nav{position:sticky;top:12px;z-index:20;margin:12px auto 0;max-width:1180px;width:calc(100% - 24px);height:58px;padding:0 10px 0 24px;display:flex;align-items:center;gap:8px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);color:#fff;box-shadow:0 14px 34px -12px rgba(0,0,0,.5)}
.nav .logo{font-weight:800;font-size:21px;letter-spacing:-.045em;text-decoration:none;margin-right:auto;display:flex;align-items:center}
.nav .logo span,.flogo span{color:#a1a1aa;font-weight:600}
.nav .logo:after,.flogo:after{content:"";width:7px;height:7px;border-radius:50%;background:#fff;margin:6px 0 0 3px}
.nav nav{display:flex;gap:2px;align-items:center}
.nav button.lnk{background:#fff!important;color:#0A0A0A!important;font-weight:600!important}
.nav a,.nav button.lnk{color:#d4d4d8;text-decoration:none;background:none;border:0;cursor:pointer;font-size:14px;font-weight:500;padding:8px 15px;border-radius:999px;transition:background .15s,color .15s}
.nav nav a:hover,.nav button.lnk:hover{background:rgba(255,255,255,.14);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--k);background:var(--k);color:#fff;padding:11px 22px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(0,0,0,.45)}
.btn.o{background:#fff;color:var(--k);border-color:var(--l)}.btn.o:hover{border-color:rgba(0,0,0,.3)}
.btn.s{padding:7px 15px;font-size:13.5px}.btn:disabled{opacity:.45;cursor:wait;transform:none;box-shadow:none}
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:12px;max-width:1180px;margin:12px auto;padding:0 12px;min-height:calc(100vh - 96px)}
.brand{position:relative;overflow:hidden;border-radius:28px;padding:44px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(110% 90% at 0% 0%,#52525b 0,#0A0A0A 58%)}
.brand:before,.brand:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.brand:before{width:300px;height:300px;right:-80px;top:-60px}.brand:after{width:180px;height:180px;right:90px;bottom:-60px}
.brand>*{position:relative;z-index:1}
.brand h1{font-size:clamp(40px,5vw,66px);margin:16px 0 14px}.brand p{color:#a1a1aa;max-width:36ch;font-size:17px;margin:0}
.pills{display:flex;gap:8px;flex-wrap:wrap}.pills span{padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:13.5px;font-weight:500}
.eyebrow{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.auth{align-self:center;width:100%;max-width:440px;margin:0 auto;padding:38px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid #fff;border-radius:28px;box-shadow:var(--sh)}
.auth h1{font-size:34px;margin-bottom:6px}
label{display:block;font-weight:600;font-size:13.5px;margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--l);background:#fff;border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--k);box-shadow:0 0 0 4px rgba(10,10,10,.08)}
input[type=checkbox]{width:auto}
.err{color:#b42318;font-weight:600;min-height:20px;margin:10px 0 0;font-size:13.5px}
.ok{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:var(--sh)}
.hint{color:var(--g);font-size:13.5px}
.dash{display:grid;grid-template-columns:220px 1fr;gap:18px;max-width:1180px;margin:18px auto 0;padding:0 12px 60px;align-items:start}
.side{padding:8px;border-radius:20px;background:#fff;border:1px solid var(--l);box-shadow:var(--sh)}
.side a{display:block;padding:10px 16px;text-decoration:none;border-radius:12px;font-weight:500;font-size:14.5px;color:#3f3f46;transition:background .15s}
.side a:hover{background:rgba(0,0,0,.05)}.side a.on{background:var(--k);color:#fff}
.body{min-width:0}
.banner{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;background:radial-gradient(120% 150% at 0% 0%,#52525b 0,#0A0A0A 60%);box-shadow:var(--sh);margin-bottom:30px}
.banner:after{content:"";position:absolute;width:260px;height:260px;right:-70px;top:-90px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.banner>*{position:relative;z-index:1}
.banner h1{font-size:clamp(28px,4vw,42px);margin:14px 0 8px}.banner p{margin:0;color:#a1a1aa;max-width:50ch}
.bstats{display:flex;gap:10px;flex-wrap:wrap}.bstats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:18px;padding:12px 20px;min-width:100px}
.bstats b{display:block;font-size:20px;font-weight:800;line-height:1.1}.bstats span{font-size:12.5px;color:#d4d4d8}
.sub{color:var(--g);margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;padding:0 0 20px;background:#fff;border:1px solid var(--l);border-radius:22px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 36px -14px rgba(0,0,0,.25)}
.card>*{margin:0 20px}.card>.cover{margin:8px 8px 4px}.card>:first-child:not(.cover){margin-top:20px}
.card h3{font-size:20px}.card p{color:var(--g);flex:1;font-size:14.5px}
.cover{height:112px;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px 16px}
.cover:after{content:"";position:absolute;width:120px;height:120px;right:-30px;top:-40px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.cover span{font-size:44px;font-weight:800;letter-spacing:-.05em;color:rgba(255,255,255,.92);line-height:1}
.c0{background:linear-gradient(135deg,#18181b,#52525b)}.c1{background:linear-gradient(135deg,#0a0a0a,#3f3f46 60%,#a1a1aa)}.c2{background:linear-gradient(135deg,#27272a,#000)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;background:#f4f4f5;border:1px solid var(--l);white-space:nowrap}
.tag.k{background:var(--k);color:#fff;border-color:var(--k)}.tag.d{color:var(--g);background:#fafafa}
.tabs{display:inline-flex;gap:4px;background:#e7e7ea;padding:4px;border-radius:999px;margin:22px 0 4px;overflow-x:auto;max-width:100%}
.tabs button{background:none;border:0;padding:8px 18px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:#52525b;white-space:nowrap}
.tabs button[aria-selected=true]{background:#fff;color:var(--k);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.bar{height:8px;background:#e4e4e7;border-radius:999px;overflow:hidden;margin:16px 0 6px;max-width:360px}.bar i{display:block;height:100%;background:var(--k);border-radius:999px}
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1px solid var(--l);border-radius:18px;margin-top:10px;box-shadow:var(--sh)}
.item .t{flex:1;min-width:0}.item b{display:block;font-weight:600}
.chk{width:26px;height:26px;border:1.5px solid #a1a1aa;background:#fff;border-radius:50%;cursor:pointer;flex:none;font-size:14px;line-height:1;color:#fff;transition:background .15s}
.chk.on{background:var(--k);border-color:var(--k)}
.scroll{overflow-x:auto;background:#fff;border:1px solid var(--l);border-radius:20px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--l);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--g);text-transform:uppercase;letter-spacing:.05em;background:#fafafa}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:#fcfcfc}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}
.stats div{background:#fff;border:1px solid var(--l);border-radius:20px;padding:16px 20px;box-shadow:var(--sh);color:var(--g);font-size:13.5px}
.stats b{display:block;font-size:22px;font-weight:800;color:var(--k);letter-spacing:-.03em}
.empty{background:rgba(255,255,255,.6);border:1.5px dashed #c4c4ca;border-radius:20px;padding:30px;color:var(--g);text-align:center}
dialog{border:0;padding:0;width:min(540px,94vw);max-height:92vh;border-radius:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,10,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{padding:28px}.dlg h2{font-size:26px}
.acct{border:1px solid var(--l);border-radius:16px;padding:12px 16px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fafafa}
.acct small{display:block;color:var(--g)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 22px;border-radius:999px;z-index:30;font-weight:600;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
.load{padding:80px;text-align:center;color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.foot{max-width:1180px;width:calc(100% - 24px);margin:28px auto 14px;min-height:58px;border-radius:999px;color:#fff;padding:8px 10px 8px 26px;display:flex;align-items:center;justify-content:space-between;gap:8px 18px;flex-wrap:wrap;background:radial-gradient(110% 260% at 0% 0%,#3f3f46 0,#0A0A0A 60%);box-shadow:var(--sh)}
.foot-brand{display:flex;align-items:center;gap:10px}
.flogo{display:flex;align-items:center;font-weight:800;font-size:18px;letter-spacing:-.045em}
.fsmall{font-size:12px;color:#a1a1aa}.fsmall b{color:#fff;font-size:13px;font-weight:700}
.foot-links{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center}.foot-links a{font-size:12.5px;color:#a1a1aa;text-decoration:none}.foot-links a:hover{color:#fff}
.foot a.fsmall{text-decoration:none}.foot a.fsmall:hover b{text-decoration:underline}
.foot-dev{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.foot .btn.s{padding:6px 14px;font-size:12.5px}
@media(max-width:1024px){.dash{grid-template-columns:190px 1fr;gap:14px}.banner{padding:28px}}
@media(max-width:860px){
.nav{height:54px;padding:0 8px 0 20px}
.split{grid-template-columns:1fr;min-height:0;margin-top:20px}.brand{display:none}.auth{padding:30px}
.dash{grid-template-columns:1fr;gap:12px;margin-top:14px}
.side{display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:999px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.side a{white-space:nowrap;flex:none;padding:9px 16px;border-radius:999px;scroll-snap-align:start}
.banner{padding:24px;border-radius:22px;margin-bottom:22px}
.bstats{width:100%;display:grid;grid-template-columns:repeat(2,1fr)}.bstats div{min-width:0}
.foot{border-radius:26px;padding:14px 18px;justify-content:center;text-align:center}.foot-brand,.foot-dev{justify-content:center}
}
@media(max-width:560px){
body{font-size:15px}
.nav{width:calc(100% - 16px);top:8px;margin-top:8px}
.nav .logo{font-size:19px}.nav a,.nav button.lnk{padding:7px 14px;font-size:13px}
.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}
input,select,textarea{font-size:16px}
.auth{padding:24px 20px;border-radius:24px}.auth h1{font-size:28px}
.banner h1{font-size:26px}
.item{flex-wrap:wrap;padding:14px}.item .t{flex:1 1 60%}.item>.btn,.item>.tag{margin-left:auto}
dialog{width:96vw;border-radius:22px}.dlg{padding:20px}.acct{flex-wrap:wrap}
th,td{padding:10px 12px}
.cert{padding:30px 18px;border-width:6px}
.toast{max-width:92vw;text-align:center;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
@media(hover:none){.card:hover{transform:none;box-shadow:var(--sh)}.btn:hover{transform:none;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="nav"></div><div id="main"><div class="load">Loading…</div></div>
<footer class="foot">
  <div class="foot-brand"><span class="flogo">soft<span>skill</span></span><span class="fsmall">© <span id="yr"></span></span></div>
  <a class="foot-dev fsmall" href="mailto:mehreenriaz1532@gmail.com?subject=Website%20inquiry" title="Need a website? Get in touch.">Developed by <b>Mehreen Riaz</b></a>
</footer>
<dialog id="dlg"><div class="dlg" id="dbody"></div></dialog>
<div id="toast" class="toast" hidden></div>
<script src="/skills.js"></script>
<script src="/lms.js"></script>
<script>
const $=s=>document.querySelector(s),main=$("#main"),dlg=$("#dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pkr=n=>n?"Rs. "+Number(n).toLocaleString("en-PK"):"Free";
const when=t=>t?new Date(t).toLocaleString("en-PK",{dateStyle:"medium",timeStyle:"short"}):"Time to be announced";
const safe=n=>n.replace(/[^\w.-]/g,"_");
const q=async p=>{const{data,error}=await p;if(error)console.error(error);return data||[]};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};
let sb,me=null,prof=null,T={c:"module",a:"payments"};
const KIND={module:["Modules","Recorded modules"],class:["Live classes","Live classes"],note:["Notes","Notes (PDF)"],link:["Links","Useful links"]};

async function boot(){
  try{const c=await(await fetch("/api/config")).json();
    if(!c.url||!c.anon)throw 0;sb=supabase.createClient(c.url,c.anon)}
  catch(e){main.innerHTML='<div class="load">Setup missing: add SUPABASE_URL and SUPABASE_ANON_KEY in Vercel, then redeploy.</div>';return}
  let lastUid;
  sb.auth.onAuthStateChange((ev,s)=>setTimeout(async()=>{
    const uid=s?.user?.id||null;
    if(ev==="TOKEN_REFRESHED"||(ev==="SIGNED_IN"&&uid&&uid===lastUid&&prof))return;
    lastUid=uid;me=s?.user||null;prof=null;
    if(me)prof=(await q(sb.from("profiles").select("*").eq("id",me.id)))[0]||null;
    if(ev==="PASSWORD_RECOVERY")location.hash="#/reset";
    go()},0));
}
addEventListener("hashchange",()=>sb&&go());

function nav(){return `<div class="nav"><a class="logo" href="${me?"#/app":"#/signin"}">soft<span>skill</span></a><nav>`+
 (me?`${prof?.is_admin?'<a href="#/admin">Admin</a>':""}<button class="lnk" data-act="out">Sign out</button>`:"")+`</nav></div>`}

async function go(){
  const h=location.hash.slice(1)||"/";
  if(/access_token|type=recovery|error_description|code=/.test(h))return;
  $("#nav").innerHTML=nav();
  const [,r="",id]=h.split("/");
  if(!r){location.hash=me?"#/app":"#/signin";return}
  if([...AUTH,"app","live","course","admin","reset"].includes(r)&&!me){location.hash="#/signin";return}
  if(r==="admin"&&!prof?.is_admin){location.hash="#/app";return}
  if(["signin","signup","forgot"].includes(r)&&me){location.hash="#/app";return}
  const V={"":landing,signin:()=>authV("signin"),signup:()=>authV("signup"),forgot:()=>authV("forgot"),reset:()=>authV("reset"),app:dash,live,course:()=>course(id),admin:admin,...EXTRA};
  main.innerHTML='<div class="load">Loading…</div>';
  main.innerHTML=await(V[r]||landing)();scrollTo(0,0);
}

async function landing(){
  const cs=await q(sb.from("courses").select("*").order("position"));
  return `<div class="wrap"><div class="hero"><h1>Skills for the next step.</h1>
  <p>A three-stage programme for Pakistani students: career readiness, live masterclasses in digital and AI leadership, and a capstone community project. Free to start.</p>
  <a class="btn" href="#/signup">Create free account</a> <a class="btn o" href="#/signin">Sign in</a></div>
  <div class="three"><div><h3>Foundations</h3><p>CV, LinkedIn, cover letters and interview preparation.</p></div>
  <div><h3>Masterclasses</h3><p>Live sessions with instructors, recorded replays and Q&amp;A.</p></div>
  <div><h3>Capstone</h3><p>Build a community project and earn a certificate.</p></div></div>
  <section><h2>Courses</h2><p class="sub">Free modules open on sign up. Paid content unlocks after payment approval.</p>
  <div class="grid">${cs.map(c=>`<div class="card"><div class="row"><span class="tag ${c.price?"":"k"}">${c.is_bundle?"Bundle":c.price?"Paid":"Free"}</span><b>${pkr(c.price)}</b></div><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><a class="btn s" href="#/${me?"course/"+c.id:"signup"}" style="align-self:flex-start">${me?"Open":"Join"}</a></div>`).join("")}</div></section></div>`}

function authV(k){
  const f={
   signin:["Sign in",`<label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><p class="hint"><a href="#/forgot">Forgot password?</a></p>`,"Sign in",`<p class="hint">New here? <a href="#/signup">Create an account</a> · <a href="#/courses">Browse courses</a></p>`],
   signup:["Create account",`<label>Full name</label><input name="name" required><div class="two"><div><label>City</label><input name="city"></div><div><label>University</label><input name="uni"></div></div><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:500"><input type="checkbox" required style="width:auto;margin-top:4px"><span>I agree to the <a href="#/help/terms" target="_blank"><u>Terms</u></a> and <a href="#/help/privacy" target="_blank"><u>Privacy Policy</u></a></span></label>`,"Sign up",`<p class="hint">Already have an account? <a href="#/signin">Sign in</a></p>`],
   forgot:["Reset password",`<p class="hint">Enter your email and we will send you a reset link.</p><label>Email</label><input name="email" type="email" required>`,"Send reset link",`<p class="hint"><a href="#/signin">Back to sign in</a></p>`],
   reset:["New password",`<label>New password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password">`,"Save password",""]}[k];
  return `<div class="split"><div class="brand"><div><span class="eyebrow">softskill</span><h1>Learn it.<br>Lead it.</h1><p>Career skills, live masterclasses and a capstone project, built for students in Pakistan.</p></div><div class="pills"><span>Modules</span><span>Live classes</span><span>Notes</span><span>Links</span></div></div><div class="auth"><h1>${f[0]}</h1><form data-form="${k}">${f[1]}<div class="err" role="alert"></div><button class="btn" style="width:100%;margin-top:14px">${f[2]}</button></form><div style="margin-top:14px">${f[3]}</div><p class="hint" style="margin:18px 0 0;text-align:center;font-size:12.5px"><a href="#/help/terms">Terms</a> · <a href="#/help/privacy">Privacy</a> · <a href="#/help/refund">Refunds</a></p></div></div>`}

  if(file.size>5e6)return err(f,"Screenshot must be under 5 MB.");
  const path=`${me.id}/${Date.now()}-${safe(file.name)}`;
  let{error}=await sb.storage.from("receipts").upload(path,file);if(error)return err(f,error.message);
  const ins=await sb.from("payments").insert({user_id:me.id,course_id:f.dataset.id,method:d.get("method"),sender_phone:ph,tid,receipt_path:path}).select("id").single();error=ins.error;
  if(error)return err(f,error.code==="23505"?"This transaction ID was already submitted.":error.message);
  dlg.close();toast("Checking your payment…");
  try{const r=await api("verify-payment",{payment_id:ins.data.id});toast(r.status==="approved"?"Payment verified. Content unlocked!":"Submitted. Admin will verify shortly.")}catch(x){toast("Submitted. Pending verification.")}
  go()},
 async addcourse(f,d){const{error}=await sb.from("courses").insert({title:d.get("title"),description:d.get("desc"),price:+d.get("price")||0,position:+d.get("pos")||0,is_bundle:d.get("bundle")==="on"});if(error)return err(f,error.message);toast("Course added");go()},
 async addlesson(f,d){const file=d.get("file");let fp=null;
  if(file&&file.size){fp=`${d.get("course_id")}/${Date.now()}-${safe(file.name)}`;const{error}=await sb.storage.from("notes").upload(fp,file);if(error)return err(f,error.message)}
  const{data:l,error}=await sb.from("lessons").insert({course_id:d.get("course_id"),kind:d.get("kind"),title:d.get("title"),is_free:d.get("is_free")==="on",position:+d.get("position")||0,starts_at:d.get("starts_at")?new Date(d.get("starts_at")).toISOString():null}).select().single();
  if(error)return err(f,error.message);
  const r=await sb.from("lesson_secrets").insert({lesson_id:l.id,url:d.get("url")||null,file_path:fp});
  if(r.error)return err(f,r.error.message);toast("Added");go()},
 async unlock(f,d){await api("admin-unlock",{},d.get("code"));sessionStorage.setItem("ac",d.get("code"));go()},
 async aicourse(f,d){const r=await api("ai-course",{text:d.get("text")},AC());PLAN={course_id:d.get("course_id"),items:r.items};
  $("#plan").innerHTML=`<p><b>${esc(r.summary)}</b></p>${r.items.map(i=>`<div class="item"><span class="tag">${i.kind}</span><div class="t"><b>${esc(i.title)}</b><span class="hint">${esc(i.url)}</span></div></div>`).join("")}<button class="btn s" data-act="applyplan" style="margin-top:12px">Add ${r.items.length} items to course</button>`;
  f.querySelector("button").disabled=false},
 async ailive(f,d){const r=await api("ai-live",{text:d.get("text")},AC());const g=document.querySelector("[data-form=addlive]").elements;
  g.title.value=r.title;g.desc.value=r.description;g.url.value=r.url;g.course_id.value=r.course_id||"";g.starts_at.value=r.start?localDT(r.start):"";
  toast(r.start&&r.url?"AI filled the form. Check it, then press Add.":"AI filled what it could. Complete the missing fields.");f.querySelector("button").disabled=false},
 async addlive(f,d){const{data:c,error}=await sb.from("live_classes").insert({title:d.get("title"),description:d.get("desc"),starts_at:new Date(d.get("starts_at")).toISOString(),course_id:d.get("course_id")||null}).select().single();
  if(error)return err(f,error.message);
  const r=await sb.from("live_links").insert({class_id:c.id,url:d.get("url")});
  if(r.error){await sb.from("live_classes").delete().eq("id",c.id);return err(f,r.error.message)}
  toast("Live class added");go()},
 async edit(f,d){const t=f.dataset.t,id=f.dataset.id,o={};
  for(const[k,,ty]of EF[t]){if(k==="url")continue;let v=d.get(k);
   if(ty==="chk")v=v==="on";else if(ty==="num")v=+v||0;else if(ty==="dt")v=new Date(v).toISOString();else if(ty==="sel")v=v||null;o[k]=v}
  let{error}=await sb.from(t).update(o).eq("id",id);if(error)return err(f,error.message);
  if(SEC[t]){const[tb,col]=SEC[t];({error}=await sb.from(tb).upsert({[col]:id,url:d.get("url")||null}));if(error)return err(f,error.message)}
  dlg.close();toast("Saved");go()},
 async settings(f,d){const rows=[...d.entries()].map(([key,value])=>({key,value}));const{error}=await sb.from("settings").upsert(rows);if(error)return err(f,error.message);toast("Saved");f.querySelector("button").disabled=false}
};
document.addEventListener("submit",async e=>{const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  f.querySelector(".err")&&(f.querySelector(".err").textContent="");
  const b=f.querySelector("button:not([type=button])");if(b)b.disabled=true;
  try{await H[f.dataset.form](f,new FormData(f))}catch(x){if(/admin code/i.test(x.message))sessionStorage.removeItem("ac");err(f,x.message||"Something went wrong. Try again.")}});

const A={
 async out(){await sb.auth.signOut();location.hash="#/"},
 unlock:el=>checkout(el.dataset.id),
 tab:el=>{T.c=el.dataset.v;go()},atab:el=>{T.a=el.dataset.v;go()},
 close:()=>dlg.close(),
 copy:el=>navigator.clipboard.writeText(el.dataset.v).then(()=>toast("Number copied"),()=>toast("Copy failed. Select it manually.")),
 async done(el){const id=el.dataset.id,on=el.classList.contains("on");
  const r=on?await sb.from("lesson_progress").delete().eq("user_id",me.id).eq("lesson_id",id):await sb.from("lesson_progress").insert({user_id:me.id,lesson_id:id});
  if(r.error)return toast(r.error.message);go()},
 async open(el){const{data:s}=await sb.from("lesson_secrets").select("*").eq("lesson_id",el.dataset.id).maybeSingle();
  if(!s)return toast("This item is locked. Unlock the course first.");
  if(s.file_path){const{data,error}=await sb.storage.from("notes").createSignedUrl(s.file_path,300);if(error)return toast(error.message);window.open(data.signedUrl,"_blank")}
  else if(s.url)window.open(s.url,"_blank","noopener");else toast("No link added yet.")},
 edit:el=>editor(el.dataset.t,el.dataset.id),
 async del(el){if(!confirm("Delete this permanently?"))return;const{error}=await sb.from(el.dataset.t).delete().eq("id",el.dataset.id);if(error)return toast(error.message);toast("Deleted");go()},
 async join(el){const{data:s}=await sb.from("live_links").select("url").eq("class_id",el.dataset.id).maybeSingle();
  if(!s)return toast("This class is locked. Unlock the course first.");window.open(s.url,"_blank","noopener")},
 async applyplan(el){if(!PLAN)return;el.disabled=true;
  const{data:mx}=await sb.from("lessons").select("position").eq("course_id",PLAN.course_id).order("position",{ascending:false}).limit(1);
  let pos=mx?.[0]?.position||0;let nm=0;const items=PLAN.items.map(i=>({...i,position:++pos,free:i.kind==="module"&&++nm<=2}));
  const{data:rows,error}=await sb.from("lessons").insert(items.map(i=>({course_id:PLAN.course_id,kind:i.kind,title:i.title,position:i.position,is_free:i.free}))).select("id,position");
  if(error){el.disabled=false;return toast(error.message)}
  const by=Object.fromEntries(rows.map(r=>[r.position,r.id])),sec=items.filter(i=>i.url).map(i=>({lesson_id:by[i.position],url:i.url}));
  if(sec.length){const r2=await sb.from("lesson_secrets").insert(sec);if(r2.error)return toast(r2.error.message)}
  PLAN=null;toast("Added to course");go()},
 async rcpt(el){const{data,error}=await sb.storage.from("receipts").createSignedUrl(el.dataset.p,300);if(error)return toast(error.message);window.open(data.signedUrl,"_blank")},
 async appr(el){const{error}=await sb.from("payments").update({status:"approved",reason:null}).eq("id",el.dataset.id);if(error)return toast(error.message);toast("Approved");go()},
 async rej(el){const r=prompt("Reason for rejection (shown to the student):","Transaction ID does not match.");if(r===null)return;
  const{error}=await sb.from("payments").update({status:"rejected",reason:r||"Receipt could not be verified."}).eq("id",el.dataset.id);if(error)return toast(error.message);go()}
};

if(typeof install==="function"){install();boot()}
else main.innerHTML='<div class="load">Setup incomplete: public/skills.js is missing. Upload it to the public folder and redeploy.</div>';
